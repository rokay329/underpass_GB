<title>Ember Hollow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root{
    --pine-900:#0c160e;
    --pine-800:#13220f;
    --moss-600:#3a5a2e;
    --lichen-300:#a9c98a;
    --lichen-100:#e4f0d4;
    --ember-500:#e08a3e;
    --ember-300:#f4b969;
    --panel:rgba(9,16,10,.72);
    --panel-border:rgba(169,201,138,.28);
    --text:var(--lichen-100);
    --text-dim:var(--lichen-300);
    --focus:var(--ember-300);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--pine-900);
    color:var(--text);
    font-family:"Space Mono", ui-monospace, monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- scene ---------- */
  .scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:var(--pine-900);
  }
  /* fills the whole viewport with a soft, darkened blow-up of the same
     art so tall/narrow phone screens never show bare letterbox bars */
  .scene__bg-fill{
    position:absolute;
    inset:-4%;
    width:108%;
    height:108%;
    object-fit:cover;
    object-position:center;
    filter:blur(38px) saturate(1.1) brightness(.5);
    transform:scale(1.06);
  }
  .scene__bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    image-rendering:pixelated;
    filter:saturate(1.05) contrast(1.04) drop-shadow(0 10px 40px rgba(0,0,0,.5));
  }
  .scene__vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 62%, transparent 30%, rgba(4,9,5,.55) 78%, rgba(2,5,3,.82) 100%);
  }
  .scene__scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,.14) 2px,
      rgba(0,0,0,.14) 3px
    );
    mix-blend-mode:multiply;
    opacity:.55;
  }
  .scene__flicker{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 57% 74%, rgba(224,138,62,.16), transparent 34%);
    animation:flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:.55;}
    18%{opacity:.85;}
    32%{opacity:.5;}
    47%{opacity:.9;}
    61%{opacity:.6;}
    78%{opacity:.8;}
    90%{opacity:.5;}
  }
  canvas.embers{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* ---------- header ---------- */
  .title{
    position:absolute;
    top:6.5vh;
    left:0;
    right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.6em;
    text-align:center;
    pointer-events:none;
    text-shadow:0 0 18px rgba(4,10,5,.9), 0 2px 0 rgba(4,10,5,.7);
  }
  .title__eyebrow{
    font-family:"Silkscreen", monospace;
    font-size:.62rem;
    letter-spacing:.42em;
    color:var(--ember-300);
    text-transform:uppercase;
  }
  .title__name{
    font-family:"Silkscreen", monospace;
    font-weight:700;
    font-size:clamp(1.4rem, 4vw, 2.6rem);
    color:var(--lichen-100);
    letter-spacing:.06em;
    line-height:1.3;
    text-wrap:balance;
  }

  /* ---------- player panel ---------- */
  .player{
    position:absolute;
    left:50%;
    bottom:5.5vh;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px 14px 14px;
    width:min(92vw, 460px);
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:10px;
    backdrop-filter:blur(6px) saturate(1.1);
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .player__btn{
    flex:none;
    width:52px;
    height:52px;
    border-radius:8px;
    border:2px solid var(--moss-600);
    background:linear-gradient(180deg, #1a2c15, #0f1c0d);
    color:var(--ember-300);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0;
    transition:border-color .15s ease, transform .1s ease;
  }
  .player__btn:hover{border-color:var(--ember-500);}
  .player__btn:active{transform:scale(.94);}
  .player__btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .player__btn svg{width:20px;height:20px;display:block;}

  .player__mid{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
    flex:1;
  }
  .player__tracknav{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .navbtn{
    flex:none;
    width:20px;
    height:20px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition:color .15s ease;
  }
  .navbtn:hover{color:var(--ember-300);}
  .navbtn:active{transform:scale(.9);}
  .navbtn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .player__track{
    font-family:"Silkscreen", monospace;
    font-size:.72rem;
    letter-spacing:.08em;
    color:var(--lichen-100);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
    width:0;
    text-align:center;
  }
  .player__dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .player__dots i{
    display:block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--moss-600);
    transition:background .2s ease, transform .2s ease;
  }
  .player__dots i.is-active{
    background:var(--ember-300);
    transform:scale(1.25);
  }
  .player__status{
    font-size:.66rem;
    color:var(--text-dim);
    letter-spacing:.03em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .player__bars{
    display:inline-flex;
    align-items:flex-end;
    gap:2px;
    height:11px;
  }
  .player__bars i{
    display:block;
    width:2px;
    background:var(--ember-500);
    border-radius:1px;
    height:3px;
    animation:none;
  }
  .is-playing .player__bars i{animation:bar 900ms ease-in-out infinite;}
  .player__bars i:nth-child(1){animation-delay:-.6s;}
  .player__bars i:nth-child(2){animation-delay:-.3s;}
  .player__bars i:nth-child(3){animation-delay:-.75s;}
  .player__bars i:nth-child(4){animation-delay:-.15s;}
  @keyframes bar{
    0%,100%{height:3px;}
    50%{height:11px;}
  }

  .player__vol{
    flex:none;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .player__vol svg{width:15px;height:15px;color:var(--text-dim);flex:none;}
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:64px;
    height:4px;
    border-radius:2px;
    background:var(--moss-600);
    outline:none;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--ember-300);
    border:1px solid var(--pine-900);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px;height:12px;
    border-radius:50%;
    background:var(--ember-300);
    border:1px solid var(--pine-900);
    cursor:pointer;
  }
  input[type="range"]:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .hint{
    position:absolute;
    bottom:1.6vh;
    left:0; right:0;
    text-align:center;
    font-size:.6rem;
    letter-spacing:.08em;
    color:var(--text-dim);
    opacity:.7;
    pointer-events:none;
  }

  @media (max-width: 520px){
    .scene{ height:100dvh; }
    .title{ top:5vh; }
    .player{
      bottom:3vh;
      gap:10px;
      padding:14px 16px 14px 14px;
      width:min(94vw, 460px);
    }
    .player__btn{width:52px;height:52px;}
    .player__btn svg{width:23px;height:23px;}
    .navbtn{width:40px; height:40px; font-size:1.4rem;}
    .player__track{font-size:.92rem; letter-spacing:.04em;}
    .player__status{font-size:.82rem; gap:8px;}
    .player__bars{height:14px;}
    .player__bars i{width:3px;}
    .player__dots i{width:7px; height:7px;}
    .player__vol{display:none;}
    .title__eyebrow{font-size:.7rem; letter-spacing:.3em;}
    .title__name{font-size:clamp(1.7rem, 8.5vw, 2.3rem);}
    .hint{font-size:.72rem; bottom:1vh;}
  }

  @media (prefers-reduced-motion: reduce){
    .scene__flicker, .player__bars i{animation:none;}
  }
</style>

  // the image is letterboxed (object-fit: contain) so it never crops;
  // work out where it actually sits inside the viewport
  var IMG_AR = 640 / 576;
  function getImageRect(){
    var containerAR = W / H;
    var rw, rh, rx, ry;
    if(containerAR > IMG_AR){
      rh = H; rw = H * IMG_AR; rx = (W - rw) / 2; ry = 0;
    } else {
      rw = W; rh = W / IMG_AR; rx = 0; ry = (H - rh) / 2;
    }
    return { x:rx, y:ry, w:rw, h:rh };
  }


  // fire sits roughly at 57.5% across, 73.5% down the source art
  function spawn(){
    var rect = getImageRect();
    var fx = rect.x + rect.w * 0.575, fy = rect.y + rect.h * 0.735;
    particles.push({
      x: fx + (Math.random()-0.5) * 26,
      y: fy - Math.random()*6,
      vx: (Math.random()-0.5) * 0.25,
      vy: -0.35 - Math.random()*0.55,
      life: 0,
      maxLife: 90 + Math.random()*70,
      size: 1 + Math.random()*1.6,
      hue: Math.random() < 0.5 ? "233,138,62" : "244,185,105"
    });
  }

  var lastSpawn = 0;
  function tick(t){
    if(!reduceMotion){
      if(t - lastSpawn > 140){
        spawn();
        lastSpawn = t;
      }
      ctx.clearRect(0,0,W,H);
      for(var i = particles.length - 1; i >= 0; i--){
        var p = particles[i];
        p.life++;
        p.x += p.vx + Math.sin(p.life*0.05)*0.15;
        p.y += p.vy;
        p.vy -= 0.0015;
        if(p.life > p.maxLife){ particles.splice(i,1); continue; }
        var f = p.life / p.maxLife;
        var alpha = f < 0.15 ? f/0.15 : 1 - (f-0.15)/0.85;
        ctx.fillStyle = "rgba(" + p.hue + "," + Math.max(alpha,0) + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - f*0.4), 0, Math.PI*2);
        ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------------- 8-bit chiptune engine ---------------- */
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var masterGain = null;
  var scheduled = false;
  var playing = false;
  var nextNoteTime = 0;
  var currentStep = 0;
  var lookahead = 25.0;      // ms
  var scheduleAhead = 0.12;  // s
  var timerId = null;
  var stepDur = function(){ return 60 / currentTrack.tempo / 2; }; // 8th notes

  // four cozy loops, switchable mid-play. each: tempo, 16-step bass roots,
  // 4 chord-group arpeggio tones, a 32-step melody (0 = rest), instrument
  // colors, and how the percussion layer behaves.
  var trackConfigs = [
    {
      name: "Attic Fire Loop",
      tempo: 84,
      bass: [45,45,45,45, 41,41,41,41, 36,36,36,36, 43,43,43,43], // A1 F1 C2 G1
      chords: [
        [57,60,64,67], // Am7
        [53,57,60,64], // Fmaj7
        [48,52,55,59], // Cmaj7
        [43,47,50,55]  // G
      ],
      melody: [
        69,0,72,71, 69,0,67,0,
        65,0,69,67, 65,0,64,0,
        60,0,64,62, 60,0,59,0,
        62,0,65,64, 62,0,60,0
      ],
      lead:"square", pad:"triangle", perc:"fire"
    },
    {
      name: "Rainy Windowsill",
      tempo: 70,
      bass: [38,38,38,38, 43,43,43,43, 36,36,36,36, 45,45,45,45], // D2 G2 C2 A2
      chords: [
        [50,53,57,60], // Dm7
        [43,46,50,53], // Gm7
        [48,52,55,59], // Cmaj7
        [45,48,52,55]  // Am7
      ],
      melody: [
        62,0,0,65, 64,0,62,0,
        60,0,0,62, 60,0,57,0,
        65,0,0,67, 65,0,64,0,
        62,0,0,60, 62,0,60,0
      ],
      lead:"triangle", pad:"sine", perc:"rain"
    },
    {
      name: "Sleeping Dog Waltz",
      tempo: 96,
      bass: [36,36,36,36, 43,43,43,43, 45,45,45,45, 41,41,41,41], // C2 G2 A2 F2
      chords: [
        [48,52,55,60], // C
        [43,47,50,55], // G
        [45,48,52,57], // Am
        [41,45,48,53]  // F
      ],
      melody: [
        72,0,71,69, 67,0,69,0,
        71,0,69,67, 65,0,67,0,
        69,0,67,65, 64,0,65,0,
        67,0,65,64, 62,0,64,0
      ],
      lead:"square", pad:"triangle", perc:"purr"
    },
    {
      name: "Midnight Skyline",
      tempo: 66,
      bass: [40,40,40,40, 36,36,36,36, 35,35,35,35, 33,33,33,33], // E2 C2 B1 A1
      chords: [
        [52,55,59,62], // Em7
        [48,52,55,59], // Cmaj7
        [47,50,54,57], // Bm7
        [45,48,52,55]  // Am7
      ],
      melody: [
        76,0,0,0, 74,0,0,0,
        72,0,0,0, 71,0,0,0,
        67,0,0,0, 71,0,0,0,
        69,0,0,0, 67,0,0,0
      ],
      lead:"sine", pad:"sine", perc:"night"
    }
  ];
  var currentTrackIndex = 0;
  var currentTrack = trackConfigs[currentTrackIndex];

  function midiToFreq(m){ return 440 * Math.pow(2, (m-69)/12); }

  function makeMaster(){
    masterGain = actx.createGain();
    masterGain.gain.value = 0.55;
    var lp = actx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 5200;
    masterGain.connect(lp);
    lp.connect(actx.destination);
    return masterGain;
  }

  function pluck(freq, time, dur, type, vol, detune){
    var osc = actx.createOscillator();
    osc.type = type || "square";
    osc.frequency.value = freq;
    if(detune) osc.detune.value = detune;
    var g = actx.createGain();
    var v = vol || 0.18;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(v, time + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  }

  function bassNote(freq, time, dur){
    var osc = actx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.22, time + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur*0.92);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur);
  }

  function hihat(time, vol){
    var bufferSize = actx.sampleRate * 0.03;
    var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    var noise = actx.createBufferSource();
    noise.buffer = buffer;
    var hp = actx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 6500;
    var g = actx.createGain();
    g.gain.value = vol || 0.05;
    noise.connect(hp);
    hp.connect(g);
    g.connect(masterGain);
    noise.start(time);
  }

  function crackle(time){
    // tiny fireplace crackle, sparse
    if(Math.random() > 0.4) return;
    var bufferSize = actx.sampleRate * 0.045;
    var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2); }
    var noise = actx.createBufferSource();
    noise.buffer = buffer;
    var bp = actx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1200 + Math.random()*2600;
    bp.Q.value = 1.2;
    var g = actx.createGain();
    g.gain.value = 0.04 + Math.random()*0.03;
    noise.connect(bp);
    bp.connect(g);
    g.connect(masterGain);
    noise.start(time);
  }

  function scheduleStep(step, time){
    var trk = currentTrack;
    var barStep = step % 16;
    var chordIdx = Math.floor(barStep / 4);

    // bass on beat 1 & 3 of each 4-step chord group (every 8 steps roughly)
    if(barStep % 8 === 0){
      bassNote(midiToFreq(trk.bass[step % trk.bass.length]), time, stepDur()*3.6);
    }
    // soft arpeggiated chord pluck, one tone per chord-group start
    if(barStep % 4 === 0){
      var tones = trk.chords[chordIdx];
      var tone = tones[Math.floor(step/4) % tones.length];
      pluck(midiToFreq(tone), time, stepDur()*1.8, trk.pad, 0.09, -4);
    }
    // melody lead, sparse & cozy
    var mstep = step % trk.melody.length;
    var note = trk.melody[mstep];
    if(note){
      pluck(midiToFreq(note), time, stepDur()*1.5, trk.lead, 0.1);
    }

    // percussion layer, flavored per track
    switch(trk.perc){
      case "fire": // sparse hats + occasional log crackle
        if(step % 2 === 0) hihat(time, 0.025);
        if(step % 3 === 0) crackle(time);
        break;
      case "rain": // steady soft patter, no crackle
        hihat(time, 0.016 + Math.random()*0.012);
        break;
      case "purr": // light bouncy hats, brighter
        if(step % 2 === 0) hihat(time, 0.03);
        break;
      case "night": // near silence, a hat every full bar
        if(step % 8 === 0) hihat(time, 0.018);
        break;
    }
  }

  function schedulerLoop(){
    while(nextNoteTime < actx.currentTime + scheduleAhead){
      scheduleStep(currentStep, nextNoteTime);
      nextNoteTime += stepDur();
      currentStep = (currentStep + 1) % 32;
    }
    timerId = window.setTimeout(schedulerLoop, lookahead);
  }

  function startMusic(){
    if(!actx){
      actx = new AudioCtx();
      makeMaster();
    }
    if(actx.state === "suspended") actx.resume();
    if(!scheduled){
      currentStep = 0;
      nextNoteTime = actx.currentTime + 0.05;
      schedulerLoop();
      scheduled = true;
    }
    playing = true;
  }

  function stopMusic(){
    playing = false;
    if(timerId){ window.clearTimeout(timerId); timerId = null; }
    scheduled = false;
    if(masterGain){
      masterGain.gain.cancelScheduledValues(actx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.0001, actx.currentTime + 0.25);
      window.setTimeout(function(){
        if(actx) actx.suspend();
      }, 300);
    }
  }

  function resumeGain(){
    if(!masterGain) return;
    var vol = parseInt(volSlider.value, 10) / 100;
    masterGain.gain.cancelScheduledValues(actx.currentTime);
    masterGain.gain.setValueAtTime(0.0001, actx.currentTime);
    masterGain.gain.linearRampToValueAtTime(Math.max(vol,0.0001) * 0.55 / 0.55 * 0.55, actx.currentTime + 0.25);
  }

  /* ---------------- UI wiring ---------------- */
  var playerEl = document.getElementById("player");
  var toggleBtn = document.getElementById("toggleBtn");
  var iconPlay = document.getElementById("iconPlay");
  var iconPause = document.getElementById("iconPause");
  var statusText = document.getElementById("statusText");
  var volSlider = document.getElementById("volSlider");
  var hint = document.getElementById("hint");
  var trackNameEl = document.getElementById("trackName");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var dotsEl = document.getElementById("trackDots");

  trackConfigs.forEach(function(){
    var dot = document.createElement("i");
    dotsEl.appendChild(dot);
  });

  function renderTrackUI(){
    trackNameEl.textContent = currentTrack.name;
    var dots = dotsEl.children;
    for(var i=0;i<dots.length;i++){
      dots[i].classList.toggle("is-active", i === currentTrackIndex);
    }
  }
  renderTrackUI();

  function switchTrack(dir){
    currentTrackIndex = (currentTrackIndex + dir + trackConfigs.length) % trackConfigs.length;
    currentTrack = trackConfigs[currentTrackIndex];
    currentStep = 0;
    renderTrackUI();
    if(playing && actx){
      var now = actx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.06);
      nextNoteTime = now + 0.09;
      window.setTimeout(setVolume, 90);
    }
  }

  prevBtn.addEventListener("click", function(e){
    e.stopPropagation();
    switchTrack(-1);
  });
  nextBtn.addEventListener("click", function(e){
    e.stopPropagation();
    switchTrack(1);
  });

  function setVolume(){
    if(!masterGain) return;
    var vol = parseInt(volSlider.value, 10) / 100;
    masterGain.gain.setTargetAtTime(0.15 + vol * 0.55, actx.currentTime, 0.05);
  }

  function setPlayingUI(isPlaying){
    playerEl.classList.toggle("is-playing", isPlaying);
    toggleBtn.setAttribute("aria-pressed", String(isPlaying));
    toggleBtn.setAttribute("aria-label", isPlaying ? "Pause music" : "Play music");
    iconPlay.style.display = isPlaying ? "none" : "";
    iconPause.style.display = isPlaying ? "" : "none";
    statusText.textContent = isPlaying ? "now playing" : "paused";
  }

  function beginPlayback(){
    startMusic();
    setVolume();
    setPlayingUI(true);
    if(hint) hint.style.display = "none";
  }

  toggleBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(playing){
      stopMusic();
      setPlayingUI(false);
    } else {
      beginPlayback();
    }
  });

  volSlider.addEventListener("input", setVolume);
  volSlider.addEventListener("click", function(e){ e.stopPropagation(); });

  // autoplay is blocked until user gesture: start on first click anywhere,
  // and reflect the muted state honestly until then.
  setPlayingUI(false);
  document.querySelector(".scene").addEventListener("click", function(){
    if(!playing) beginPlayback();
  }, { once:false });

})();
</script>
